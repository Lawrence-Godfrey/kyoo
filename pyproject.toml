[project]
name = "kyoo"
version = "0.2.6"
description = "A local job queue for agents and people: enqueue commands with locks, dependencies and preflight checks; watch them from the CLI, an MCP server or a web page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lawrence Godfrey" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "mcp>=1.2",
]
keywords = ["queue", "jobs", "mcp", "agents", "scheduler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
kyoo = "kyoo.cli:app"

[project.urls]
Repository = "https://github.com/Lawrence-Godfrey/kyoo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyoo"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
